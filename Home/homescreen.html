<html>
  <link rel="stylesheet" href="../Core/main.css" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./settings.css" />

  <body>
    <div
      class="flexbox"
      id="bg-overlay"
      style="
        width: 100vw;
        height: 100vh;
        backdrop-filter: blur(100px);
        background: #00000090;
      "
    >
      <div id="reactive_note_core" class="flexbox">
        <div id="logo" class="image logo"></div>
      </div>
      <div style="height: 50px; display: block"></div>
      <div id="buttons-container" style="transition: all 0.2s ease">
        <div style="opacity: 0.5">
          <btext
            style="
              animation: fadein ease 1s forwards;
              opacity: 0;
              font-family: &quot;Modern&quot;;
              font-weight: 500;
            "
            id="quote"
          ></btext>
        </div>
        <btn
          class="controller_selectable flexbox selected"
          style="
            animation: fadein ease 1s 0s forwards;
            opacity: 0;
            width: 460px;
          "
          id="play-button"
          onclick="fadeThisOut('../Picker/LevelPicker.html')"
          ><div>Play</div>
          <div
            class="icon"
            style="background-image: url(&quot;../Assets/Glyphs/Play.svg&quot;)"
          ></div
        ></btn>
        <btn
          class="controller_selectable flexbox"
          style="animation: fadein ease 1s 0.2s forwards; opacity: 0"
          onclick="openSettings()"
          ><div>Settings</div>
          <div
            class="icon"
            style="
              background-image: url(&quot;../Assets/Glyphs/Settings.svg&quot;);
            "
          ></div
        ></btn>
        <btn
          class="controller_selectable flexbox"
          style="animation: fadein ease 1s 0.5s forwards; opacity: 0"
          onclick="fadeThisOut('./firstContact.html')"
          ><div>Tutorial</div>
          <div
            class="icon"
            style="background-image: url(&quot;../Assets/Glyphs/Help.svg&quot;)"
          ></div
        ></btn>
        <btn
          class="controller_selectable flexbox"
          style="animation: fadein ease 1s 0.7s forwards; opacity: 0"
          onclick="ipcRenderer.send('quit_app')"
          ><div>Exit</div>
          <div
            class="icon"
            style="background-image: url(&quot;../Assets/Glyphs/Exit.svg&quot;)"
          ></div
        ></btn>
      </div>
    </div>
  </body>
  <script>
    let quotes = [
      `Pick your poison.`,
      `Welcome.`,
      `Where to?`,
      `Bored?`,
      `What do you want to do?`,
      `Ready?`,
      `Hopping in?`,
      `Excited?`,
      `Hey.`,
    ];

    let i = Math.floor(Math.random() * quotes.length);
    let r = quotes[i];
    document.getElementById('quote').innerHTML = r;
  </script>

  <script src="../Utilities/global.js"></script>
  <script src="../Utilities/dynamix.js"></script>
  <script src="../Utilities/controller-control.js"></script>
  <script src="../Core/defaultComponents.js"></script>
  <script src="../Core/slimselect.min.js"></script>
  <script src="./home.js"></script>
  <script src="./settings.js"></script>
</html>
