<!DOCTYPE html>
<html>
  <div id="app">
  <svg width="370" height="245" viewBox="0 0 370 245" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="glowGradient" x1="0" y1="1" x2="0" y2="0">
        <stop id="edge-bottom" offset="1" stop-color="black" />
        <stop id="glow-center" offset="1" stop-color="white" />
        <stop id="edge-top"    offset="1" stop-color="black" />
      </linearGradient>

      <mask id="lightMask">
        <rect width="100%" height="100%" fill="url(#glowGradient)" />
      </mask>
    </defs>

    <g mask="url(#lightMask)">
      <path d="M231.637 244.5H136.856L-0.499981 -0.5L369.5 -0.5L231.637 244.5Z" fill="white" fill-opacity="0.9"/>
      <rect x="184" width="3" height="150" fill="white" />
      <rect x="174" y="-47" width="23" height="250" fill="white" opacity="0.4" />
    </g>
  </svg>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<script>
const duration = 0.5; 
  const glowWidth = 0.4; // The fixed thickness of the beam
  
  const tl = gsap.timeline({ repeat: -1 });

  // Start all stops below the view (offset > 1) 
  // and move them above the view (offset < 0)
  tl.fromTo("#edge-top", 
  { attr: { offset: 0 }, duration: duration, ease: "none" }, 
  { attr: { offset: 1 + (glowWidth * 2) }, duration: duration, ease: "none" }, 
    0
  )
  .fromTo("#glow-center", 
  { attr: { offset: -glowWidth }, duration: duration, ease: "none" }, 
    { attr: { offset: 1 + glowWidth }, duration: duration, ease: "none" }, 
    0
  )
  .fromTo("#edge-bottom", 
  { attr: { offset: -(glowWidth * 2) }, duration: duration, ease: "none" }, 
    { attr: { offset: 1 }, duration: duration, ease: "none" }, 
    0
  );
</script>

<style>
  body { 
    background: #000; 
    margin: 0; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    overflow: hidden;
  }

  /* Optional: adds that high-end Electron UI feel */
  svg {
    filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
  }
</style>
</html>
