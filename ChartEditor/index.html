<html>
  <link rel="stylesheet" href="./notes.css" />
  <link rel="stylesheet" href="../Core/main.css" />
  <link rel="stylesheet" href="./style.css" />

  <link rel="stylesheet" href="../Core/studio.css" />

    href="../Core/defaultComponents.css"
  />
  <link rel="stylesheet" href="../Playfield/sfx.css" />

  <svg width="0" height="0" style="position: absolute">
    <defs>
      <mask id="trapezoidMask" maskUnits="objectBoundingBox">
        <rect width="1" height="1" fill="black" />

        <path
          d="M231.637 244.5H136.856L-0.499981 -0.5L369.5 -0.5L231.637 244.5Z"
          fill="white"
        />
      </mask>
    </defs>
  </svg>

  <link rel="stylesheet" href="../Core/slimselect.css" />
  <link rel="stylesheet" href="./overlay.css" />
  <meta charset="UTF-8" />
  <div id="controls" class="flexbox">
    <btext id="tabText">chart events</btext>
    <div id="noteInfo" class="flexbox">
      <div id="tabs" class="studio-tabs">
      </div>
      <div id="global">hey</div>
      <div id="local" style="height: 100%; width: 100%;">
      </div>
    </div>
    <select
      style="position: fixed; top: 20; right: 28; width: 500px; position: absolute;"
      id="beatSnap"
    >
      <option value="1">1/1</option>
      <option value="2">1/2</option>
      <option value="3">1/3</option>
      <option value="4">1/4</option>
      <option value="5">1/5</option>
      <option value="6">1/6</option>
      <option value="7">1/7</option>
      <option value="8">1/8</option>
      <option value="12">1/12</option>
      <option value="16">1/16</option>
    </select>
    <btext id="beatSnapText">beat snap</btext>

    <btext id="beatsPerMinuteText">bpm</btext>
    <input
      id="beatsPerMinute"
      oninput="changeBPM(this.value)"
      value="80"
      max="500"
      type="number"
      class="ss-main"
    />
    <!-- <btext id="offsetText">offset ms</btext>
    <input id="offset" type="number" value="0" class="ss-main" /> -->

      id="zoomFactor"
      type="range"

      oninput="updateZoom(19 - this.value)"

    /> -->
        <div id="levelInfo">
          <div id="songArt" class="image"></div>
          <div id="songName"></div>
          <div id="songArtist"></div>
        </div>
    <div id="buttons">

      <btn
        id="backButton"
        onclick="location.href = '../Picker/LevelPicker.html'"
      >
        <div class="image pause" style="width: 50px; aspect-ratio: 1/1"></div>
      </btn>
      <btn
        id="saveButton"
        onclick="saveChartDetails()"
      >
        <div class="image save" style="width: 50px; aspect-ratio: 1/1"></div>
      </btn>

    </div>
    <div id="gradeParent" class="flexbox"></div>
    <btextm id="songData">
      <span
        id="difficultyTag"
        style="margin-left: auto"
        class="difficulty-dot wideDot flexbox"
      >
        <difficulty id="difficulty"></difficulty>
      </span>
    </btextm>
  </div>

  <body>
    <div id="overlay">
      <div class="dust" id="dust"></div>
      <div class="lightshow_item" id="lightshow_1"></div>
      <div class="lightshow_item" id="lightshow_2"></div>
      <div class="lightshow_item" id="lightshow_3"></div>
      <div class="lightshow_item" id="lightshow_4"></div>
      <div class="lightshow_item" id="lightshow_5"></div>
      <div class="lightshow_item" id="lightshow_6"></div>
      <div class="lightshow_item" id="lightshow_7"></div>
      <div class="lightshow_item" id="lightshow_8"></div>
      <div id="topLevelContainer" class="flexbox">
        <div id="mouseAugumenter"></div>
        <div id="noteContainer">
          <div id="noteContainerFrame"></div>

          <div class="frame" id="centerContainer"></div>
          <div class="highlight_container" id="highlight_container"></div>
        </div>

        <div class="leftHandPane">
          <div id="note-type-0" class="largeButton">
            <div
              style="
                background-image: url(&quot;../Assets/Misc/duplicate.svg&quot;);
              "
            ></div>
          </div>
          <div id="note-type-1" class="largeButton">
            <div
              style="
                background-image: url(&quot;../Assets/Headers/geometrical/Note.svg&quot;);
              "
            ></div>
          </div>
          <div id="note-type-2" class="largeButton">
            <div
              style="
                background-image: url(&quot;../Assets/Headers/geometrical/Note Golden.svg&quot;);
              "
            ></div>
          </div>
          <div id="note-type-3" class="largeButton">
            <div
              style="
                background-image: url(&quot;../Assets/Headers/geometrical/Note\ Holdable.svg&quot;);
              "
            ></div>
          </div>
          <div id="note-type-4" class="largeButton">
            <div
              style="
                background-image: url(&quot;../Assets/Headers/geometrical/Frame.svg&quot;);
              "
            ></div>
          </div>
          <div id="note-type-5" class="largeButton">
            <div
              style="
                background-image: url(&quot;../Assets/Headers/Trace.svg&quot;);
                rotate: 30deg;
              "
            ></div>
          </div>
          <div id="note-type-6" class="largeButton">
            <div
              style="
                background-image: url(&quot;../Assets/Headers/Trace Short.svg&quot;);
              "
            ></div>
          </div>
          <div id="note-type-7" class="largeButton">
            <div
              style="
                background-image: url(&quot;../Assets/Headers/Trace Bridge.svg&quot;);
                rotate: -45deg;
              "
            ></div>
          </div>
        </div>
        <btext id="durationLabel"
          ><span id="timestampDuration">180000</span>ms /
          <span id="humanformatDuration">03:00:00</span></btext
        >
        <btext id="timeRangeLabel"
          ><span id="timestamp">000000</span>ms /
          <span id="humanformat">00:00:00</span></btext
        >
        <input
          id="timeRange"
          onupdate="seekToTime(this.value)"
          min="0"
          onmousedown="createRangeListener()"
          max="180000"
          step="1"
          type="range"
        />
      </div>
      <div id="chart_overlay">
        <div id="chart_lines"></div>
        <lane id="chart-lane-0"></lane>
        <lane id="chart-lane-1"></lane>
        <lane id="chart-lane-2"></lane>
        <lane id="chart-lane-3"></lane>
        <lane id="chart-lane-4"></lane>
        <lane id="chart-lane-5"></lane>
      </div>
    </div>
  </body>
  <script src="../Core/slimselect.min.js"></script>
  <script src="../Utilities/global.js"></script>
  <script src="../Core/defaultComponents.js"></script>
  <script src="editor.js"></script>
  <script src="./RhythmGame.js"></script>
  <script src="../Playfield/ScoringSystem.js"></script>
  <script src="./GameState.js"></script>
  <script src="../Playfield/InputSystem.js"></script>
  <script src="../Playfield/TimingSystem.js"></script>
  <script src="../Playfield/RenderingSystem.js"></script>
  <script src="chart.js"></script>
  <script src="control.js"></script>
</html>
