<html>
  <link rel="stylesheet" href="./notes.css" />
  <link rel="stylesheet" href="../Core/main.css" />
  <link rel="stylesheet" href="./sfx.css" />
  <link rel="stylesheet" href="./overlay.css" />
  <meta charset="UTF-8" />
    <div id="controls" class="flexbox">
      <div id="buttons">
        <btn id="pauseButton" onclick="game.pauseGame()">
          <div class="image pause" style="width: 50px; aspect-ratio: 1/1"></div>
        </btn>
        <btn id="restartButton" class="hiddenButton" onclick="game.restart()">
          <div class="image reset" style="width: 50px; aspect-ratio: 1/1"></div>
        </btn>
        <btn
          id="backButton"
          class="hiddenButton"
          onclick="game.uninitializeGame()"
        >
          <div class="image back" style="width: 50px; aspect-ratio: 1/1"></div>
        </btn>
      </div>
      <!-- <p>perspective rotate height width t1 t2</p>
      <input type="range" min="200" max="1500" oninput="updatePerspective(this.value)">
      <input type="range" min="50" max="120" oninput="updateRotate(this.value)">
      <input type="range" min="200" max="2000" oninput="updateHeight(this.value)">
      <input type="range" min="50" max="500" oninput="updateWidth(this.value)">
      <input type="range" min="100" max="700" oninput="updateTranslate1(this.value)">
      <input type="range" min="100" max="900" oninput="updateTranslate2(this.value)">
      <input type="range" min="" max="" oninput="updateMarginTop(this.value)"> -->
      <div id="gradeParent" class="flexbox"></div>
      <btextm id="songData">
        <div id="songName"></div>
        <div id="songArtist"></div>
        <span
          id="difficultyTag"
          style="margin-left: auto"
          class="difficulty-dot wideDot flexbox"
        >
          <difficulty id="difficulty"></difficulty>
        </span>
      </btextm>
      <div id="songArt" class="image"></div>

    </div>

  <body>
    <div id="overlay">
      <div id="scoreHUD">
        <div id="unusedScore">00000000000000</div>
        <div id="usedScore">0</div>
      </div>
      <div class="dust" id="dust"></div>
      <div class="lightshow_item" id="lightshow_1"></div>
      <div class="lightshow_item" id="lightshow_2"></div>
      <div class="lightshow_item" id="lightshow_3"></div>
      <div class="lightshow_item" id="lightshow_4"></div>
      <div class="lightshow_item" id="lightshow_5"></div>
      <div class="lightshow_item" id="lightshow_6"></div>
      <div class="lightshow_item" id="lightshow_7"></div>
      <div class="lightshow_item" id="lightshow_8"></div>
      <div id="topLevelContainer" class="flexbox">
        <div id="noteContainer">
          <!-- <div class="baseLane" style="--id:0" id="lane_0"></div>
          <div class="baseLane" style="--id:1" id="lane_1"></div>
          <div class="baseLane" style="--id:2" id="lane_2"></div>
          <div class="baseLane" style="--id:3" id="lane_3"></div>
          <div class="baseLane" style="--id:4" id="lane_4"></div>
          <div class="baseLane" style="--id:5" id="lane_5"></div> -->
          <!-- <div class="lane" style="transform: rotate(30deg); background: red;"></div> -->
          <div id="noteContainerFrame"></div>

          <div class="frame" id="centerContainer"></div>
          <div class="highlight_container" id="highlight_container"></div>
          <div class="center flexbox" style="--i: 0">
            <div style="margin: auto">
              <btextm id="comboText" class="small">Combo</btextm>
              <btextm id="comboDisplay">0</btextm>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="perfectionIndicator">
      <div class="indicator" id="perfect"></div>
      <div class="indicator" id="great"></div>
      <div class="indicator" id="okay"></div>
      <div class="indicator" id="bad"></div>
      <div class="indicator" id="miss"></div>
    </div>
  </body>
  <script src="4ndroid.js"></script>
  <script src="../Utilities/global.js"></script>
  <script src="GameState.js"></script>
  <script src="TimingSystem.js"></script>
  <script src="InputSystem.js"></script>
  <script src="ScoringSystem.js"></script>
  <script src="RenderingSystem.js"></script>
  <script src="RhythmGame.js"></script>
  <script src="script.js"></script>
</html>
